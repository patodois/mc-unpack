[package]
name = "mc-unpack"
version = "0.2.0"
edition = "2021"
description = "Reader for the block and item models and textures in your own Minecraft Java Edition client jar, and for your world saves, with a rewrite-bridge provider (unofficial, for Minecraft)"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/patodois/mc-unpack"
# The highest of the dependencies' own (zip and zopfli need 1.88); this crate itself needs 1.82
rust-version = "1.88"
# The render scripts and the CI file are for the repository, not for the package
exclude = ["/render", "/.github"]
keywords = ["minecraft", "models", "gltf", "rewrite", "assets"]
categories = ["game-development", "parser-implementations"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Gzip and zlib: the compressions of level.dat and of the chunks in a region file. Already in the tree (the zip crate uses it)
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
png = "0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# The client jar is a zip of 5,000 to 15,000 entries (most of them classes). The crate reads the
# central directory once and then seeks to single entries: the jar is never extracted.
zip = { version = "8", default-features = false, features = ["deflate"] }
# The bridge to other game rewrites (see src/bridge.rs, github.com/patodois/rewrite-bridge)
rewrite-bridge = { version = "0.2.2", optional = true }

# The peak memory report of `check`
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["bridge"]
# `Provider` for Minecraft, and the CLI commands that use it
bridge = ["dep:rewrite-bridge"]

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
